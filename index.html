
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>ExCenArtInOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

    <!-- Device status -->
    <header class="status-bar">
        <span id="date-time">--:-- --</span>
        <span id="battery">Battery | --</span>
        <span id="network">Network | --</span>
    </header>

    <!-- Homepage -->
    <section class="home-content" id="home-content">

        <div class="top-gap"></div>

        <!-- Search opens inside the OS workspace -->
        <form class="search-box" id="search-form" role="search">
            <input type="search" name="q" id="search-input"
                   placeholder="Search Google"
                   aria-label="Search Google"
                   autocomplete="off">
            <button type="submit">Search</button>
        </form>

        <div class="small-gap"></div>

        <!-- Applications -->
        <section class="app-grid" id="app-grid">

            <button class="app" data-app="Directory">
                <span class="app-icon">▤</span>
                <span>Directory</span>
            </button>

            <button class="app" data-app="Social">
                <span class="app-icon">◎</span>
                <span>Social</span>
            </button>

            <button class="app" data-app="Files">
                <span class="app-icon">▱</span>
                <span>Files</span>
            </button>

            <button class="app" data-app="Image">
                <span class="app-icon">▧</span>
                <span>Image</span>
            </button>

            <button class="app" data-app="Music">
                <span class="app-icon">♫</span>
                <span>Music</span>
            </button>

            <button class="app" data-app="Video">
                <span class="app-icon">▷</span>
                <span>Video</span>
            </button>

            <button class="app" data-app="Tools">
                <span class="app-icon">⚙</span>
                <span>Tools</span>
            </button>

            <button class="app" data-app="Game">
                <span class="app-icon">⌘</span>
                <span>Game</span>
            </button>

            <button class="app" data-app="Device Info">
                <span class="app-icon">▣</span>
                <span>Device Info</span>
            </button>

        </section>

        <div class="small-gap"></div>

        <section class="extra-options">
            <button class="option" data-open="security">
                Security
            </button>

            <button class="option" data-open="support">
                Support
            </button>
        </section>

        <div class="small-gap"></div>

    </section>

    <!-- Workspace -->
    <main class="view-panel" id="view-panel" hidden>

        <div class="view-heading">
    <span id="view-title">Apps</span>
</div>

        <div id="view-content"></div>

    </main>

    <!-- Persistent bottom panel -->
    <footer class="bottom-panel">

        <button id="back-button">
            <span>←</span>
            <small>Back</small>
        </button>

        <button id="apps-button">
            <span>▦</span>
            <small>Apps</small>
        </button>

        <button id="clock-button">
            <span>◷</span>
            <small>Clock</small>
        </button>

        <button id="calendar-button">
            <span>▦</span>
            <small>Calendar</small>
        </button>

        <button id="calculator-button">
            <span>＋</span>
            <small>Calculator</small>
        </button>

        <button id="home-button">
            <span>⌂</span>
            <small>Homepage</small>
        </button>

    </footer>

</div>

<!-- OS page lock -->
<section id="lock-screen" class="lock-screen" hidden>

    <div class="lock-content">

        <div class="lock-clock" id="lock-time">--:--</div>
        <div id="lock-date"></div>

        <h3>ExCenArtInOS Locked</h3>

        <p>Enter your password to continue</p>

        <form id="unlock-form">

            <input id="unlock-password"
                   type="password"
                   placeholder="Password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Unlock</button>

        </form>

        <p id="unlock-message" class="message"></p>

    </div>

</section>

<script src="script.js" defer></script>

</body>
</html>
