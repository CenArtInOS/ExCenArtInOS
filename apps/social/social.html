<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#101010">
    <title>Social</title>

    <link rel="stylesheet" href="social.css">
</head>

<body>
    <main class="social-app">

        <!-- Top browser bar -->
        <header class="social-header">
            <div class="site-address" id="siteAddress">
                facebook.com
            </div>

            <button class="header-button"
                    id="refreshButton"
                    type="button"
                    aria-label="Refresh"
                    title="Refresh">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 7v5h-5M4 17v-5h5"
                          fill="none" stroke="currentColor"
                          stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"
                          fill="none" stroke="currentColor"
                          stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </button>

            <button class="header-button"
                    id="externalButton"
                    type="button"
                    aria-label="Open in browser"
                    title="Open in browser">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 4h6v6M20 4l-9 9"
                          fill="none" stroke="currentColor"
                          stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"
                          fill="none" stroke="currentColor"
                          stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </button>
        </header>

        <!-- Website viewing area -->
        <section class="website-area" id="websiteArea">

            <div class="website-loading" id="loadingMessage">
                Loading website...
            </div>

            <div class="website-error" id="errorMessage">
                <div class="error-symbol">↗</div>
                <p>This website may not allow loading inside another app.</p>
                <button type="button" id="openFallbackButton">
                    Open website in browser
                </button>
            </div>

            <!-- Individual website frames are created by social.js -->
            <div class="website-frame-container" id="frameContainer"></div>

        </section>

        <!-- Icon-only social platform switcher -->
        <nav class="social-switcher" aria-label="Social platforms">

            <button class="social-icon active"
                    type="button"
                    data-platform="facebook"
                    aria-label="Facebook"
                    title="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor"
                          d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.3-1.6 1.6-1.6h1.7V3.5c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.2v2.3H7.7V13h2.7v8z"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="instagram"
                    aria-label="Instagram"
                    title="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3.2" y="3.2" width="17.6" height="17.6"
                          rx="5" fill="none" stroke="currentColor"
                          stroke-width="2"/>
                    <circle cx="12" cy="12" r="4"
                            fill="none" stroke="currentColor"
                            stroke-width="2"/>
                    <circle cx="17.6" cy="6.7" r="1.2"
                            fill="currentColor"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="x"
                    aria-label="X"
                    title="X">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 3h4.8l11.2 18h-4.8zM20 3 5 21"
                          fill="none" stroke="currentColor"
                          stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="wechat"
                    aria-label="WeChat"
                    title="WeChat">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11.5 5.2c-4.1 0-7.4 2.5-7.4 5.7 0 1.8 1.1 3.4 2.8 4.4l-.7 2.5 3-1.5c.7.2 1.5.3 2.3.3 4.1 0 7.4-2.5 7.4-5.7s-3.3-5.7-7.4-5.7z"
                          fill="none" stroke="currentColor"
                          stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M8.5 10h.1M14 10h.1"
                          stroke="currentColor" stroke-width="2.3"
                          stroke-linecap="round"/>
                    <path d="M15.2 15.2c.5 2.1 2.7 3.6 5.3 3.6l1.5.8-.4-1.8c.8-.6 1.3-1.5 1.3-2.5 0-1.9-1.9-3.5-4.2-3.5"
                          fill="none" stroke="currentColor"
                          stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="line"
                    aria-label="LINE"
                    title="LINE">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3.5c-5.1 0-9.2 3.3-9.2 7.4 0 3.7 3.3 6.8 7.8 7.3l-.3 2.2c-.1.6.5.9 1 .6l4.4-2.8c3.3-1.2 5.5-3.9 5.5-7.3 0-4.1-4.1-7.4-9.2-7.4z"
                          fill="none" stroke="currentColor"
                          stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M7 9v4h2M11 9v4M14 9v4M17 9v4"
                          fill="none" stroke="currentColor"
                          stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="telegram"
                    aria-label="Telegram"
                    title="Telegram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m21 4-3.2 16-6.1-4.5-3.1 2.9.5-5.5L19 6.1 7.3 12.9 3 11.5z"
                          fill="none" stroke="currentColor"
                          stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="reddit"
                    aria-label="Reddit"
                    title="Reddit">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12.5" r="8"
                            fill="none" stroke="currentColor"
                            stroke-width="1.7"/>
                    <path d="m9 14 1.5 1M15 14l-1.5 1M9 10h.1M15 10h.1M10 17c1.3.8 2.7.8 4 0"
                          fill="none" stroke="currentColor"
                          stroke-width="1.7" stroke-linecap="round"/>
                    <path d="m12 4 1-2 3 1"
                          fill="none" stroke="currentColor"
                          stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="17" cy="3" r="1"
                            fill="currentColor"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="pinterest"
                    aria-label="Pinterest"
                    title="Pinterest">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3a9 9 0 0 0-3.3 17.4c-.1-1.5 0-3.2.4-4.8l1.3-5.5s-.3-.6-.3-1.5c0-1.4.8-2.5 1.9-2.5.9 0 1.3.7 1.3 1.5 0 .9-.6 2.3-.9 3.6-.3 1.1.6 2 1.7 2 2.1 0 3.6-2.7 3.6-5.9 0-2.4-1.6-4.2-4.6-4.2-3.4 0-5.5 2.5-5.5 5.3 0 1 .3 1.8.8 2.4.2.3.3.4.2.7l-.3 1c-.1.3-.3.4-.6.3-1.6-.7-2.4-2.5-2.4-4.5 0-3.4 2.9-7.5 8.7-7.5 4.7 0 7.8 3.4 7.8 7.1 0 4.9-2.7 8.6-6.7 8.6-1.3 0-2.5-.7-2.9-1.5l-.8 3.1c-.3 1.1-.9 2.2-1.4 3A9 9 0 1 0 12 3z"
                          fill="currentColor"/>
                </svg>
            </button>

            <button class="social-icon"
                    type="button"
                    data-platform="snapchat"
                    aria-label="Snapchat"
                    title="Snapchat">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3.2c-2.5 0-4 1.8-4 4.4 0 .8.1 1.6.2 2.4-.5.4-1.3.3-2-.1-.4-.2-.8-.1-.9.3-.1.5.5 1.1 1.3 1.3-.3 1.5-1.6 3.4-3.1 4.1-.5.2-.5.8.1 1 1 .4 2 .5 2.6.6.3.1.4.5.5.9.1.4.5.6 1 .5 1.1-.2 2.1.2 3.1 1 .8.6 1.7.9 2.2.9s1.4-.3 2.2-.9c1-.8 2-1.2 3.1-1 .5.1.9-.1 1-.5.1-.4.2-.8.5-.9.6-.1 1.6-.2 2.6-.6.6-.2.6-.8.1-1-1.5-.7-2.8-2.6-3.1-4.1.8-.2 1.4-.8 1.3-1.3-.1-.4-.5-.5-.9-.3-.7.4-1.5.5-2 .1.1-.8.2-1.6.2-2.4 0-2.6-1.5-4.4-4-4.4z"
                          fill="currentColor"/>
                </svg>
            </button>

        </nav>

    </main>

    <script src="social.js"></script>
</body>
              </html>
