
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>Calculator | ExCenArtInOS</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <main class="calculator-app">

        <!-- Calculator heading -->
        <header class="calculator-heading">
            <div>
                <h1>Calculator</h1>
                <p>Simple and precise calculations</p>
            </div>
            <div class="calculator-symbol" aria-hidden="true">±</div>
        </header>

        <!-- Calculator display -->
        <section class="calculator-display" aria-label="Calculator display">
            <div id="expressionDisplay" class="expression-display" aria-live="polite"></div>
            <input
                id="calcDisplay"
                class="result-display"
                type="text"
                value="0"
                readonly
                aria-label="Calculation result"
            >
            <div id="statusDisplay" class="status-display">Ready</div>
        </section>

        <!-- Calculator buttons -->
        <section class="calculator-keypad" id="calculatorKeypad">

            <button class="key key-function" data-action="clear">AC</button>
            <button class="key key-function" data-action="delete" aria-label="Delete last character">⌫</button>
            <button class="key key-function" data-value="(">(</button>
            <button class="key key-operator" data-value="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key key-operator" data-value="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key key-operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key key-operator" data-value="+">+</button>

            <button class="key key-function" data-value="%">%</button>
            <button class="key key-zero" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key key-equals" data-action="calculate">=</button>

        </section>

        <footer class="calculator-footer">
            <span>ExCenArtInOS</span>
            <span>Calculator</span>
        </footer>

    </main>

    <script src="calculator.js"></script>
</body>
</html>
