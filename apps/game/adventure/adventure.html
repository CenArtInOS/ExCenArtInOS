
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <title>Adventure Rush: Endless Run</title>
    <link rel="stylesheet" href="adventure.css">
</head>
<body>
    <main id="game">
        <header class="topbar">
            <div class="game-name">ADVENTURE RUSH</div>

            <div class="stats">
                <span>SCORE <b id="scoreValue">0</b></span>
                <span>DISTANCE <b id="distanceValue">0 m</b></span>
                <span>COINS <b id="coinValue">0</b></span>
                <span class="life-stat">LIVES <b id="livesValue">♥ ♥ ♥</b></span>
            </div>

            <button id="pauseButton" class="small-button" aria-label="Pause">Ⅱ</button>
        </header>

        <section class="game-area">
            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div id="overlay" class="overlay">
                <div class="menu-panel">
                    <div class="eyebrow">ENDLESS ADVENTURE</div>
                    <h1 id="overlayTitle">Adventure Rush</h1>
                    <p id="overlayText">
                        Explore an endless world. Move manually,
                        collect coins and survive as far as possible.
                    </p>

                    <div id="finalStats" class="final-stats hidden">
                        <div>FINAL SCORE <b id="finalScore">0</b></div>
                        <div>DISTANCE <b id="finalDistance">0 m</b></div>
                        <div>COINS <b id="finalCoins">0</b></div>
                        <div>LIVES LEFT <b id="finalLives">0</b></div>
                        <div>BEST DISTANCE <b id="bestDistance">0 m</b></div>
                    </div>

                    <button id="playButton" class="main-button">
                        START ADVENTURE
                    </button>
                </div>
            </div>
        </section>

        <footer class="controls">
            <div class="movement">
                <button class="control-button" data-control="left">◀</button>
                <button class="control-button" data-control="right">▶</button>
            </div>

            <button class="control-button jump-button" data-control="jump">
                JUMP
            </button>
        </footer>
    </main>

    <script src="adventure.js"></script>
</body>
</html>
