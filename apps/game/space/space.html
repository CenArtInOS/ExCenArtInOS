
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <title>Space Combat</title>
    <link rel="stylesheet" href="space.css">
</head>
<body>
    <main class="game-shell">
        <header class="top-hud">
            <div class="hud-stat">
                <span>WAVE</span>
                <strong id="waveValue">1</strong>
            </div>
            <div class="hud-stat">
                <span>SCORE</span>
                <strong id="scoreValue">0</strong>
            </div>
            <div class="hud-stat">
                <span>LIVES</span>
                <strong id="livesValue">3</strong>
            </div>
            <button id="pauseButton" class="pause-button" type="button" aria-label="Pause game">Ⅱ</button>
        </header>

        <section class="play-area">
            <canvas id="gameCanvas" aria-label="Space combat game"></canvas>
            <div id="message" class="game-message"></div>

            <div id="startScreen" class="screen-layer">
                <div class="screen-card">
                    <h1>SPACE COMBAT</h1>
                    <p>Destroy the incoming aircraft and survive each wave.</p>
                    <button id="startButton" class="main-button" type="button">START GAME</button>
                </div>
            </div>

            <div id="pauseScreen" class="screen-layer hidden">
                <div class="screen-card">
                    <h2>PAUSED</h2>
                    <button id="resumeButton" class="main-button" type="button">RESUME</button>
                </div>
            </div>

            <div id="gameOverScreen" class="screen-layer hidden">
                <div class="screen-card">
                    <h2>GAME OVER</h2>
                    <p>FINAL SCORE: <strong id="finalScore">0</strong></p>
                    <button id="restartButton" class="main-button" type="button">PLAY AGAIN</button>
                </div>
            </div>
        </section>

        <footer class="control-panel">
            <div class="direction-pad" aria-label="Movement controls">
                <span class="control-spacer"></span>
                <button type="button" data-direction="up" aria-label="Move up">▲</button>
                <span class="control-spacer"></span>
                <button type="button" data-direction="left" aria-label="Move left">◀</button>
                <button type="button" data-direction="down" aria-label="Move down">▼</button>
                <button type="button" data-direction="right" aria-label="Move right">▶</button>
            </div>
            <button id="fireButton" class="fire-button" type="button">FIRE</button>
        </footer>
    </main>

    <script src="space.js"></script>
</body>
</html>
