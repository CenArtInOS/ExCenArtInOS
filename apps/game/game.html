
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d13">

    <title>Games - ExCenArtInOS</title>

    <link rel="stylesheet" href="game.css">
</head>

<body>

    <!-- Scrollable game selection area -->
    <main class="game-list">

        <button class="game-item" data-game="adventure">
            <div class="game-icon">🏃</div>
            <div class="game-info">
                <strong>Adventure Rush</strong>
                <small>Platform adventure and monster challenges</small>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="game-item" data-game="racing">
            <div class="game-icon">🏎️</div>
            <div class="game-info">
                <strong>Car Racing</strong>
                <small>Traffic racing with multiple vehicles</small>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="game-item" data-game="space">
            <div class="game-icon">🚀</div>
            <div class="game-info">
                <strong>Space Combat</strong>
                <small>Space battles and enemy waves</small>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="game-item" data-game="snake">
            <div class="game-icon">🐍</div>
            <div class="game-info">
                <strong>Snake</strong>
                <small>Classic snake with obstacles and portals</small>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="game-item" data-game="block">
            <div class="game-icon">🧩</div>
            <div class="game-info">
                <strong>Block Puzzle</strong>
                <small>Stack blocks and clear lines</small>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="game-item" data-game="bike">
            <div class="game-icon">🏍️</div>
            <div class="game-info">
                <strong>Motorcycle Off-road</strong>
                <small>Ride through challenging terrain</small>
            </div>
            <span class="arrow">›</span>
        </button>

    </main>

    <script src="game.js"></script>

</body>
</html>
